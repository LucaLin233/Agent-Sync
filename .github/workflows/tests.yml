# 仓库测试：PR 和 main 上跑 full 与 identity（Linux 上合计约 10 s）。
# pull_request 运行 PR 自身的代码，只给 contents: read，不用任何秘密。
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4 固定完整 SHA，与 commit-identities.yml 相同；升级须重新核对。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: full
        id: full
        run: sh tests/run-tests.sh full
      - name: TLS failure detail
        if: ${{ failure() && steps.full.outcome == 'failure' }}
        run: |
          work=$(mktemp -d "${TMPDIR:-/tmp}/run-tests-XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/home" "$work/tmp"
          cd tests
          env -i PATH="$PATH" HOME="$work/home" TMPDIR="$work/tmp" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONIOENCODING=utf-8 PYTHONDONTWRITEBYTECODE=1 TZ=UTC python3 -B -m unittest -v test-surge-scripts.SectionWriteTest.test_t6_tls_trusted_ca_and_hostname_mismatch </dev/null
      - name: identity
        if: ${{ !cancelled() && (steps.full.outcome == 'success' || steps.full.outcome == 'failure') }}
        run: sh tests/run-tests.sh group identity
